name: Android APK

on:
  push:
    branches: [android-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET Android workload
        run: |
          dotnet workload install android
          dotnet workload restore

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The .NET Android workload brings platform/build-tools/aapt2, so we don't need a separate
      # system Android SDK install. Just locate the SDK manager that ships with the runner image.
      - name: Locate Android SDK
        id: sdk
        run: |
          SDKMGR=""
          for path in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/*/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager" \
            "$ANDROID_HOME/embedded/tools/bin/sdkmanager" \
            "$ANDROID_HOME/embedded/cmdline-tools/*/bin/sdkmanager"; do
            if [ -f "$path" ]; then
              SDKMGR="$(cd "$(dirname "$path")" && pwd)"
              break
            fi
          done
          echo "sdkmgr=$SDKMGR"
          echo "sdkmgr=$SDKMGR" >> "$GITHUB_OUTPUT"

      - name: Accept Android Licenses & install API 36 platform + build-tools
        run: |
          SDKMGR="${{ steps.sdk.outputs.sdkmgr }}"
          if [ -z "$SDKMGR" ]; then
            echo "No sdkmanager found; relying on the .NET Android workload's bundled SDK."
            exit 0
          fi
          # API 36 (Baklava) is too new to be preinstalled on the runner image, and the
          # .NET Android workload does NOT provision the Google Android SDK's platforms/ or
          # build-tools/. ResolveSdks requires platforms/android-36 (android.jar) and
          # build-tools/36.0.0, so install them explicitly here. `yes` auto-accepts licenses.
          yes | "$SDKMGR/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMGR/sdkmanager" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5
          echo "=== installed SDK packages ==="
          "$SDKMGR/sdkmanager" --list_installed 2>/dev/null | grep -iE "android-36|build-tools" || true

      - name: Install NDK
        run: |
          SDKMGR="${{ steps.sdk.outputs.sdkmgr }}"
          NDK_DIR=""
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)
            echo "Found existing NDK: $NDK_DIR"
          fi
          if [ -z "$NDK_DIR" ] && [ -n "$SDKMGR" ]; then
            "$SDKMGR" --update 2>&1 | tail -1 || true
            for v in "27.0.11902897" "27.0.12179864" "26.1.10909125" "25.2.9519183"; do
              if "$SDKMGR" "ndk;${v}" 2>&1 | grep -qiE "error|fail"; then
                echo "NDK $v not found, trying next..."
              else
                NDK_DIR="$ANDROID_HOME/ndk/${v}"
                echo "Installed NDK $v: $NDK_DIR"
                break
              fi
            done
          fi
          if [ -z "$NDK_DIR" ]; then
            echo "Downloading NDK r26d directly..."
            curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
            mkdir -p "$ANDROID_HOME"
            unzip -q /tmp/ndk.zip -o -d "$ANDROID_HOME"
            NDK_DIR="$ANDROID_HOME/android-ndk-r26d"
            echo "Downloaded NDK to: $NDK_DIR"
          fi
          echo "NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$NDK_DIR"

      # Cross-compile FreeType 2.13.3, Lua 5.1.5, OpenAL-Soft 1.23.1 for arm64-v8a (API 24)
      # into OpenRA.Android/jniLibs/arm64-v8a/ (libfreetype6.so, liblua51.so, libsoft_oal.so).
      - name: Build native libraries (arm64-v8a)
        run: |
          bash thirdparty/build-android-linux.sh "$NDK_ROOT"

      - name: Verify native libraries
        run: |
          echo "=== Verifying native libraries ==="
          for lib in libfreetype6.so libfreetype.so liblua51.so libsoft_oal.so; do
            if [ -f "OpenRA.Android/jniLibs/arm64-v8a/$lib" ]; then
              echo "  OK: $lib found in jniLibs"
            else
              echo "  WARNING: $lib is not in jniLibs"
            fi
          done

      # BuildForAndroid=true switches OpenRA.Game (+ the rest) to the net10.0-android TFM so
      # OperatingSystem.IsAndroid() is fully supported, and the EGL backend is selected at runtime.
      #
      # This publishes Debug with portable PDBs on purpose. A Release build strips the line
      # tables, so a crash on device reports "at OpenRA.Graphics.SpriteCache.LoadReservations"
      # with no line number -- which is useless when the engine is throwing from a 2000-line
      # method and you are bisecting data files by hand. The Debug cost is build time and APK
      # size, both of which we are already paying for in iteration time.
      #
      # AndroidIncludeDebugSymbols must stay OFF here even though it sounds right. It pulls
      # in libmono-android.debug.so, and that runtime refuses to start from a normal sideloaded
      # APK: it looks for assemblies under files/.__override__/arm64-v8a, does not find them,
      # decides it is a Fast Deployment bundle and aborts with SIGABRT before MainActivity runs.
      # Since the symbols are injected separately in the next step, all this build needs is a
      # Debug compile that emits portable PDBs next to the assemblies.
      - name: Build & package APK
        run: |
          dotnet publish OpenRA.Android/OpenRA.Android.csproj \
            -c Debug -f net10.0-android \
            -p:BuildForAndroid=true \
            -p:AndroidPackageFormats=apk \
            -p:RunAotCompilation=false \
            -p:DebugType=portable \
            -p:DebugSymbols=true \
            -p:AndroidIncludeDebugSymbols=false \
            -p:AndroidManagedSymbols=true

      # The .NET Android SDK collects PDBs into the _ResolvedSymbols item but nothing in the
      # packaging pipeline consumes it, so AndroidIncludeDebugSymbols=true on its own still
      # yields pdb count: 0. Rather than keep guessing at SDK internals, inject the symbols
      # directly: take them from the publish output and add them to the APK under
      # assemblies/, which is where the .NET Android runtime looks for them.
      - name: Inject debug symbols into APK
        run: |
          set -eu
          # Pick the LARGEST apk, not the first one found; see tools/yr-port/pick_apk.sh for
          # why `find -print -quit` reliably selects the wrong (partial) package here.
          APK=$(bash tools/yr-port/pick_apk.sh) || APK=""
          if [ -z "$APK" ]; then echo "::error::No APK to inspect"; exit 1; fi
          echo "APK (largest): $APK ($(stat -c%s "$APK") bytes)"

          echo "=== PDBs in the publish output ==="
          find bin obj -name '*.pdb' -type f 2>/dev/null | head -20 || true
          PDB_TOTAL=$(find bin obj -name '*.pdb' -type f 2>/dev/null | wc -l)
          echo "pdb files on disk: $PDB_TOTAL"
          if [ "$PDB_TOTAL" -eq 0 ]; then
            echo "::error::No PDBs under bin/ or obj/. A -c Debug build should have produced them."
            exit 1
          fi

          # The find/copy/filter/repack work all happens in Python. Doing it in shell needs a
          # `find | while read` pipeline, and under `set -o pipefail` a non-matching glob or
          # an early exit in the loop body kills the whole step even though every PDB was
          # copied fine.
          python3 tools/yr-port/inject_pdb_into_apk.py --apk "$APK" --search bin obj

          # Guard the failure that cost a device round trip: shipping
          # libmono-android.debug.so makes the runtime abort at startup with
          # "No assemblies found in ... .__override__/... Assuming this is part of Fast
          # Deployment", before any managed code runs and with no OpenRA log line.
          #
          # `grep -c` not `grep -q`: under `set -o pipefail` a `grep -q` that matches exits
          # early, unzip takes SIGPIPE, and the pipeline reports 141 -- a successful check
          # would look like a failure and kill the step.
          if [ "$(unzip -l "$APK" | grep -c 'libmono-android.debug.so' || true)" -ne 0 ]; then
            echo "::error::APK contains libmono-android.debug.so; the app will abort at startup on a sideloaded install. Keep AndroidIncludeDebugSymbols=false and inject the PDBs instead."
            exit 1
          fi
          echo "runtime check: no debug runtime in the APK"

      # Release publish leaves the APK UNSIGNED; Android 7+ refuses to install an unsigned APK
      # (OEMs report this as "解析包时出现问题 / packageInfo is null"). Sign it here so the
      # artifact installs via sideload.
      #
      # The keystore is stable across runs when the OPENRA_KEYSTORE_B64 secret is set. That
      # matters for iterating on device: Android refuses to replace an installed package with
      # one signed by a different key (INSTALL_FAILED_UPDATE_INCOMPATIBLE), so a per-run
      # ephemeral key forces a full uninstall every build -- and an uninstall wipes
      # /sdcard/Android/data/<pkg>/, taking gigabytes of game content with it.
      #
      # Generate a secret with:
      #   keytool -genkeypair -v -keystore openra-debug.keystore -alias openra \
      #     -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
      #     -dname "CN=OpenRA Debug,O=OpenRA,C=US"
      #   base64 -w0 openra-debug.keystore   # -> Actions secret OPENRA_KEYSTORE_B64
      #
      # Never commit the keystore itself: it would publish the signing identity.
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.OPENRA_KEYSTORE_B64 }}
        run: |
          # Must be the same file the inject step modified and the collect step uploads.
          # This one used `find -print -quit` and signed
          # OpenRA.Android/obj/Debug/android/bin/com.openra.android.apk while the artifact
          # came from bin/publish/...-Signed.apk, so the shipped APK had never been
          # symbol-injected (0 PDBs) and the signature check passed anyway because both
          # copies came from the same build. Route it through pick_apk.sh like the others.
          APK=$(bash tools/yr-port/pick_apk.sh) || APK=""
          if [ -z "$APK" ]; then echo "::error::No APK to sign"; exit 1; fi
          echo "=== signing $APK ==="
          KEYSTORE="$RUNNER_TEMP/openra-debug.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using the repository signing key (stable across runs)."
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          else
            echo "::warning::OPENRA_KEYSTORE_B64 is not set; generating an ephemeral key. Each build will need a clean uninstall on device."
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias openra \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=OpenRA Debug,O=OpenRA,C=US" 2>&1 | tail -1
          fi
          APKSIGNER_JAR="$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
          java -jar "$APKSIGNER_JAR" sign \
            --ks "$KEYSTORE" --ks-key-alias openra \
            --ks-pass pass:android --key-pass pass:android \
            --out "$APK.signed" "$APK"
          mv -f "$APK.signed" "$APK"
          echo "=== signed: $APK ==="
          java -jar "$APKSIGNER_JAR" verify --verbose --print-certs "$APK" | head -12

      # Every step that needs "the APK" must select the largest one. See the comment in
      # "Inject debug symbols into APK": a publish leaves a partial obj/ package behind and
      # it sorts first alphabetically, so `find -print -quit` picks the wrong file. The
      # selection is centralised in pick_apk.sh so the three consumers cannot drift apart.
      - name: Collect APK (robust)
        if: always()
        run: |
          set -eu
          echo "=== find any *.apk under workspace ==="
          find . -type f -name '*.apk' -exec ls -la {} \; 2>/dev/null || true
          echo "=== find any *.aab (backup) ==="
          find . -type f -name '*.aab' -print 2>/dev/null || true
          APK=$(bash tools/yr-port/pick_apk.sh) || APK=""
          if [ -n "$APK" ]; then
            mkdir -p "$GITHUB_WORKSPACE/apkout"
            cp "$APK" "$GITHUB_WORKSPACE/apkout/openra-android.apk"
            echo "COPIED $APK -> apkout/openra-android.apk"
            ls -la "$GITHUB_WORKSPACE/apkout"

            # The shipped artifact must be the one that was symbol-injected. A step that
            # signs or copies a different file still produces a valid, installable APK with
            # the right signature, so only this assertion catches it.
            PDB_COUNT=$(unzip -l "$GITHUB_WORKSPACE/apkout/openra-android.apk" | grep -cE '\.pdb$' || true)
            echo "PDB entries in the artifact: $PDB_COUNT"
            if [ "$PDB_COUNT" -eq 0 ]; then
              echo "::error::The artifact has no PDBs, so a device crash would report no line numbers. Check that Sign/Collect pick the same APK that Inject modified."
              exit 1
            fi
          else
            echo "NO APK FOUND"
          fi

      - name: Verify native libraries in APK
        if: always()
        run: |
          APK=$(bash tools/yr-port/pick_apk.sh) || APK=""
          if [ -n "$APK" ]; then
            echo "=== Native libraries in $APK ==="
            unzip -l "$APK" | grep -E "\.so$" || echo "WARNING: No native libraries found in APK!"
            for lib in libfreetype6.so liblua51.so libsoft_oal.so libassembly-store.so libmonodroid.so; do
              if [ "$(unzip -l "$APK" | grep -c "$lib" || true)" -gt 0 ]; then
                echo "  OK: $lib found"
              else
                echo "  MISSING: $lib NOT found in APK!"
              fi
            done
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openra-android
          path: apkout/
