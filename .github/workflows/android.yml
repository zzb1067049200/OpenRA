name: Android APK

on:
  push:
    branches: [android-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # .NET 的 Android workload 自带 platform / build-tools / aapt2，
      # 不需要再装一套系统级 Android SDK（android-actions/setup-android 已废弃，
      # 其内部 `sdkmanager tools` 在现代 SDK 上必然失败）。
      - name: Install .NET Android workload
        run: dotnet workload install android

      # 关键:工程用 Microsoft.NET.Sdk + net10.0-android(TFM 路径能正确导入 Android 构建目标,
      # 故 AOT 能跑),并在 csproj 显式置 <AndroidApplication>true</AndroidApplication> 解除
      # _BuildApk 的闸。此环境下 Sdk="Microsoft.Android.Sdk" 会因 workload 只装了 runtime pack
      # 而解析失败,故不用它。用显式 SignAndroidPackage 目标强制 编译+_BuildApk+签名 出 .apk。
      # csproj 已设 <AndroidPackageFormats>apk</AndroidPackageFormats>(Release 默认只出 aab)。
      - name: Build & package APK
        run: dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net10.0-android -t:SignAndroidPackage -p:AndroidPackageFormats=apk

      # 诊断:列出 bin/Release 下真实产出的 apk/aab,确认打包到底有没有发生、产在哪
      - name: Locate built package (diagnostic)
        if: always()
        run: |
          echo "=== find apk/aab under bin/Release ==="
          find OpenRA.Android/bin/Release -type f \( -name '*.apk' -o -name '*.aab' \) -print 2>/dev/null || true
          echo "=== bin/Release tree (top) ==="
          ls -R OpenRA.Android/bin/Release 2>/dev/null | head -40 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openra-android
          # 兼容 publish/ 子目录与直接落在 RID 目录两种情况
          path: OpenRA.Android/bin/Release/**/*.apk
