name: Android APK

on:
  push:
    branches: [android-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # .NET 的 Android workload 自带 platform / build-tools / aapt2，
      # 不需要再装一套系统级 Android SDK（android-actions/setup-android 已废弃，
      # 其内部 `sdkmanager tools` 在现代 SDK 上必然失败）。
      - name: Install .NET Android workload
        run: dotnet workload install android

      # 注意:.NET Android 的 `dotnet build` 只编译 IL/原生库,不会产出可安装包;
      # 必须用 `dotnet publish`(内部走 _BuildApk+签名)才会真正生成 .apk。
      # 配合 csproj 里的 <AndroidPackageFormats>apk</AndroidPackageFormats>(Release 默认只出 aab)。
      - name: Build & publish APK
        run: dotnet publish OpenRA.Android/OpenRA.Android.csproj -c Release -f net10.0-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openra-android
          # publish 产物在 android-arm64/publish/ 下,用 ** 兜住层级变化
          path: OpenRA.Android/bin/Release/**/*.apk
