name: Android APK

on:
  push:
    branches: [android-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Setup Android SDK (API 35)
        uses: android-actions/setup-android@v3
        with:
          api-level: 35

      - name: Ensure build-tools
        run: sdkmanager "build-tools;35.0.0" || true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net10.0-android -p:RuntimeIdentifier=android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openra-android
          path: OpenRA.Android/bin/Release/net10.0-android/android-arm64/*.apk
