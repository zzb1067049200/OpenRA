name: Android APK

on:
  push:
    branches: [android-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          # 浮动到最新稳定版即可：项目已改用 RID 特定 SDK 包
          # Microsoft.Android.Sdk.Linux/36.1.69(从 nuget 还原),不再依赖
          # workload 的 SDK resolver,故不必钉死 band。runtime packs 仍由
          # `dotnet workload install android` 提供。
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # .NET 的 Android workload 自带 platform / build-tools / aapt2，
      # 不需要再装一套系统级 Android SDK（android-actions/setup-android 已废弃，
      # 其内部 `sdkmanager tools` 在现代 SDK 上必然失败）。
      - name: Install .NET Android workload
        run: dotnet workload install android

      # 工程 Sdk 已换回 Microsoft.Android.Sdk(只有它接入 _BuildApk 打包链)。
      # dotnet publish 会真正触发 _BuildApk + 用 debug keystore 签名,产出 .apk。
      # csproj 已设 <AndroidPackageFormats>apk</AndroidPackageFormats>(Release 默认只出 aab)。
      - name: Build & package APK
        run: dotnet publish OpenRA.Android/OpenRA.Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormats=apk

      # 收集产物:OpenRA 自定义输出路径(bin/ 在仓库根,而非 OpenRA.Android/bin/Release/),
      # 故不赌路径——全仓找 .apk 拷到固定目录再上传。
      - name: Collect APK (robust)
        if: always()
        run: |
          echo "=== find any *.apk under workspace ==="
          find . -type f -name '*.apk' -print 2>/dev/null || true
          echo "=== find any *.aab (backup) ==="
          find . -type f -name '*.aab' -print 2>/dev/null || true
          APK=$(find . -type f -name '*.apk' -print -quit 2>/dev/null || true)
          if [ -n "$APK" ]; then
            mkdir -p "$GITHUB_WORKSPACE/apkout"
            cp "$APK" "$GITHUB_WORKSPACE/apkout/openra-android.apk"
            echo "COPIED $APK -> apkout/openra-android.apk"
            ls -la "$GITHUB_WORKSPACE/apkout"
          else
            echo "NO APK FOUND"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openra-android
          path: apkout/
