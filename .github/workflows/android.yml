name: Android APK

on:
  push:
    branches: [android-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # .NET 的 Android workload 自带 platform / build-tools / aapt2，
      # 不需要再装一套系统级 Android SDK（android-actions/setup-android 已废弃，
      # 其内部 `sdkmanager tools` 在现代 SDK 上必然失败）。
      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build APK
        run: dotnet build OpenRA.Android/OpenRA.Android.csproj -c Release -f net10.0-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openra-android
          path: OpenRA.Android/bin/Release/net10.0-android/android-arm64/*.apk
